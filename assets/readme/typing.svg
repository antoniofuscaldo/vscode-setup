<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" role="img" aria-labelledby="title desc">
  <title id="title">Animated README typing strip</title>
  <desc id="desc">A soft animated strip cycling through the main qualities of the setup.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c2e7" />
      <stop offset="35%" stop-color="#cba6f7" />
      <stop offset="70%" stop-color="#89dceb" />
      <stop offset="100%" stop-color="#a6e3a1" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <rect x="14" y="14" width="1172" height="68" rx="8" fill="#11111b" stroke="url(#border)" stroke-width="2" />
  <rect x="54" y="46" width="1092" height="2" rx="1" fill="url(#border)" opacity="0.32" filter="url(#blur)" />

  <circle cx="50" cy="48" r="7" fill="#f5c2e7">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="74" cy="48" r="7" fill="#cba6f7">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="98" cy="48" r="7" fill="#89dceb">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="1.6s" begin="0.35s" repeatCount="indefinite" />
  </circle>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#cdd6f4">
    <text x="138" y="57" opacity="0">Polished editor ergonomics for real daily work.
      <animate attributeName="opacity" values="0;1;1;0;0" dur="12s" begin="0s" repeatCount="indefinite" />
    </text>
    <text x="138" y="57" opacity="0">Soft Catppuccin color, modern typography, clean motion.
      <animate attributeName="opacity" values="0;0;1;1;0" dur="12s" begin="0s" repeatCount="indefinite" />
    </text>
    <text x="138" y="57" opacity="0">Manual, reviewable setup for macOS, Windows, and Linux.
      <animate attributeName="opacity" values="0;0;0;1;1;0" dur="12s" begin="0s" repeatCount="indefinite" />
    </text>
  </g>

  <rect x="138" y="66" width="46" height="3" rx="1.5" fill="#f5c2e7">
    <animate attributeName="x" values="138;640;138" dur="5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#f5c2e7;#cba6f7;#89dceb;#a6e3a1;#f5c2e7" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>
